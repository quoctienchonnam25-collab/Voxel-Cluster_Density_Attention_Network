[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-saliency-v4"
version = "4.0.2"
description = "Hybrid Saliency Enhanced V4 - Brain Age Prediction with Saliency Map-Enhanced Features"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Anonymous", email = "anonymous@review.com"}
]
keywords = [
    "brain age prediction",
    "medical imaging", 
    "deep learning",
    "saliency map",
    "activation map",
    "graph neural networks",
    "transformer",
    "MRI analysis"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent",
]

dependencies = [
    "torch>=1.10.0",
    "torchvision>=0.11.0",
    "torch-geometric>=2.0.0",
    "monai>=0.9.0",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.4.0",
    "nibabel>=3.2.0",
    "tqdm>=4.62.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
]

[project.urls]
Homepage = "https://anonymous.review/hybrid-saliency-v4"
Documentation = "https://anonymous.review/hybrid-saliency-v4/wiki"
Repository = "https://anonymous.review/hybrid-saliency-v4"
"Bug Tracker" = "https://anonymous.review/hybrid-saliency-v4/issues"

[project.scripts]
hybrid-saliency-train = "hybrid_saliency_v4.training.train:main"
hybrid-saliency-predict = "hybrid_saliency_v4.predict:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hybrid_saliency_v4 = [
    "checkpoints/*.pth",
    "configs/*.yaml",
    "configs/*.json",
]
